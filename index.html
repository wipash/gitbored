<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GitBored</title>
    <script>
      try { const t = localStorage.getItem('gitbored.theme'); document.documentElement.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <style>html { background: #f7f8fa; } html[data-theme="dark"] { background: #171a21; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/api/client-config.js"></script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
