name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [gate, expiry, unconfigured]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify runtime and install locked dependencies
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(pnpm exec node --version)" = "v$(cat .node-version)"
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint, type-check, test and build
        if: matrix.mode == 'gate'
        env:
          CONTROLLED_SESSION_SECONDS: '900'
        run: pnpm gate
      - name: Verify session expiry
        if: matrix.mode == 'expiry'
        env:
          CONTROLLED_SESSION_SECONDS: '10'
        run: pnpm test:e2e tests/e2e/auth.spec.ts --grep 'an expired server session'
      - name: Verify missing GitHub configuration
        if: matrix.mode == 'unconfigured'
        env:
          E2E_AUTH_MODE: unconfigured
        run: pnpm test:e2e tests/e2e/auth-unconfigured.spec.ts
      - name: Preserve failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ matrix.mode }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build and smoke-test image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: gitbored:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify HTTP, non-root runtime, persistence and backup
        run: bash scripts/smoke-container.sh gitbored:ci
      - name: Export tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save gitbored:ci | gzip > image.tar.gz
      - name: Pass tested image to publisher
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-image
          path: image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          gzip -dc image.tar.gz | docker load
          docker tag gitbored:ci "$image:sha-$REVISION"
          docker tag gitbored:ci "$image:latest"
          docker push "$image:sha-$REVISION"
          docker push "$image:latest"
